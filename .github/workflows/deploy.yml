name: Deploy to GitHub Pages

# Builds the site and publishes it whenever you push to main.
#
# One-time setup in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# BASE_PATH is worked out automatically:
#   • repo named <user>.github.io      → served at the root, no base path
#   • any other repo name              → served at /<repo>/, base path set

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the base path and site URL
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO" = "${OWNER,,}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER,,}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER,,}.github.io/$REPO" >> "$GITHUB_OUTPUT"
          fi

      # A custom domain wins: set a repository variable SITE_URL
      # (Settings -> Secrets and variables -> Actions -> Variables)
      # to e.g. https://franciscocisternas.com

      - run: npm ci

      # NEXT_PUBLIC_CONTACT_ENDPOINT is the Google Apps Script Web App URL
      # that receives contact-form submissions and writes them to the
      # Google Sheet. Add it under
      #   Settings -> Secrets and variables -> Actions -> Variables
      # as CONTACT_ENDPOINT. Until it is set, the deployed form falls back
      # to opening the visitor's own mail client and says so on the page.
      # Setup instructions: scripts/google-sheets-endpoint.gs

      # TINA_CLIENT_ID (variable) and TINA_TOKEN (secret) connect the
      # /admin editor to TinaCloud -- from the project's Overview and
      # Tokens pages at app.tina.io. Until both are set, `build:tina`
      # fails; use `npm run build` instead, which skips the editor build
      # entirely and still deploys the rest of the site.

      # GOATCOUNTER_CODE is the site code from goatcounter.com (Settings ->
      # main); GA_MEASUREMENT_ID is the G-XXXXXXXXXX id from a GA4 property's
      # Data Stream. Either can be added independently -- until set, that
      # tracker just doesn't load (see src/components/Analytics.tsx).
      # ANALYTICS_ENDPOINT/ANALYTICS_SECRET are the Apps Script Web App URL
      # and shared secret the private TinaCMS "Analytics" screen reads from
      # (scripts/analytics-dashboard-endpoint.gs) -- unrelated to the two
      # trackers above.
      # GUESTBOOK_ENDPOINT is the Apps Script Web App URL the "Stay
      # Connected" form posts to (scripts/guestbook-endpoint.gs). Until set,
      # that form is visible but submitting does nothing, same principle as
      # the contact form above.
      - run: npm run build:tina
        env:
          BASE_PATH: ${{ vars.SITE_URL && '' || steps.base.outputs.path }}
          SITE_URL: ${{ vars.SITE_URL || steps.base.outputs.url }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ vars.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}
          NEXT_PUBLIC_ANALYTICS_SECRET: ${{ secrets.ANALYTICS_SECRET }}
          NEXT_PUBLIC_GUESTBOOK_ENDPOINT: ${{ vars.GUESTBOOK_ENDPOINT }}

      # Stops GitHub Pages running the output through Jekyll, which would
      # strip the _next/ directory and break every stylesheet and script.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
